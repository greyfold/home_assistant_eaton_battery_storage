name: HACS Action

on:
  push:
    tags:
      - "v*" # Only run on version tags like v0.1.0
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run HACS validation
        uses: hacs/action@main
        with:
          category: integration

      - name: Validation with hassfest
        uses: "home-assistant/actions/hassfest@master"

  quality:
    name: Lint, Type Check and Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Must match the Python version Home Assistant itself runs on, since
          # mypy parses the installed Home Assistant sources.
          python-version: "3.14"
          cache: pip

      - name: Install test requirements
        run: pip install -r requirements_test.txt

      - name: Ruff check
        run: ruff check custom_components tests

      - name: Ruff format check
        run: ruff format --check custom_components tests

      - name: Mypy
        run: mypy custom_components/eaton_battery_storage

      - name: Pytest
        run: pytest tests --cov=custom_components.eaton_battery_storage --cov-report=term-missing --cov-fail-under=98

  release:
    name: Create Release Zip
    runs-on: ubuntu-latest
    needs: [hacs, quality]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create ZIP file
        run: |
          zip -r eaton_battery_storage.zip . -x "*.git*" -x "*.github*" -x "tests/*" -x "pyproject.toml" -x "requirements_test.txt"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: eaton_battery_storage.zip
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_ZIP }}
